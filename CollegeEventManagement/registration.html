<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{
background:#f8f9fa;
}
.form-container{
max-width:800px;
margin:auto;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">College Events</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
<li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
<li class="nav-item"><a class="nav-link active" href="registration.html">Registration</a></li>
<li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
<li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
</ul>
</div>
</div>
</nav>

<section class="py-5">
<div class="container">
<div class="form-container">
<div class="card shadow">
<div class="card-header bg-primary text-white text-center">
<h2>Event Registration Form</h2>
</div>
<div class="card-body">
<div class="alert alert-success d-none" id="successMsg">
Registration Successful! Thank you for registering.
</div>

<form id="eventForm">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Student Name</label>
<input type="text" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Roll Number</label>
<input type="text" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Branch</label>
<select class="form-select" required>
<option value="">Select Branch</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>IT</option>
<option>MECH</option>
<option>CIVIL</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Mobile Number</label>
<input type="tel" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Event Selection</label>
<select class="form-select" required>
<option value="">Select Event</option>
<option>Technical Quiz</option>
<option>Hackathon</option>
<option>Poster Presentation</option>
<option>Coding Contest</option>
<option>Project Expo</option>
<option>Cultural Fest</option>
</select>
</div>
</div>

<div class="text-center">
<button type="submit" class="btn btn-primary px-4">Register</button>
<button type="reset" class="btn btn-secondary px-4">Reset</button>
</div>
</form>

</div>
</div>
</div>
</div>
</section>

<footer class="bg-dark text-white py-4">
<div class="container text-center">
<h5>College Event Management System</h5>
<p>events@college.edu | +91 9876543210</p>
<a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
<a href="#" class="text-white me-3"><i class="bi bi-instagram"></i></a>
<a href="#" class="text-white me-3"><i class="bi bi-linkedin"></i></a>
<a href="#" class="text-white"><i class="bi bi-youtube"></i></a>
</div>
</footer>

<script>
document.getElementById("eventForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("successMsg").classList.remove("d-none");
this.reset();
window.scrollTo({top:0,behavior:"smooth"});
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
