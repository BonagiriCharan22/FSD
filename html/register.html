    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header>
    <h1>Society Survey & Representative Election Management System</h1>

    <nav>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>

        </ul>
    </nav>
</header>

<main>

    <section class="regi">

        <form action="login.html">

            <h2 style="text-align:center;">Resident Registration</h2>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" required>

            <label for="flat">Flat / House Number</label>
            <input type="text" id="flat" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" required>

            <label>Resident Type</label>

            <div>
                <input type="radio" name="resident" id="owner">
                <label for="owner">Owner</label>
            </div>

            <div>
                <input type="radio" name="resident" id="tenant">
                <label for="tenant">Tenant</label>
            </div>

            <br>

            <input type="submit" value="Register">

        </form>

    </section>

</main>

<footer>
    <p>
        © 2026 Society Survey & Representative Election Management System
    </p>
</footer>

</body>
</html>
